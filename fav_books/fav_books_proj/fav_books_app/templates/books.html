<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/style.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    {%load static%}
    <link rel="stylesheet" href="{%static 'css/style.css'%}">
</head>

<body>
    <div class="container">
        <nav class="navbar navbar-expand-lg ">
            <div
                class="container-fluid d-flex justify-content-between align-items-center border-bottom border-dark p-2">
                <div>
                    <a class="navbar-brand " href="#">Welcome <span class="text-success">{{user.first_name}}</span></a>
                </div>
                <div>
                    <a class="btn btn-outline-danger" href="/logout">Logout</a>
                </div>
            </div>
        </nav>

        <div class="row">
            {% if messages %}
            <div class="container mt-3">
                {% for message in messages %}
                <div class="alert {{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endfor %}
            </div>
            {% endif %}
            <div class="col">
                <div class="card">
                    <div class="card-header">
                        <h1>Add a Favorit Book</h1>
                    </div>
                    <div class="card-body">
                        <form action="/books/create" method="post">
                            {%csrf_token%}
                            <div class="mb-3">
                                <label for="title" class="form-label">title</label>
                                <input type="text" class="form-control" name="title" id="title">
                            </div>
                            <div class="form-floating mb-3">
                                <textarea class="form-control" placeholder="Leave a comment here" name="desc"
                                    id="floatingTextarea2" style="height: 100px"></textarea>
                                <label for="floatingTextarea2">Description</label>
                            </div>
                            <input type="submit" value="Add" class="btn btn-primary">
                        </form>
                    </div>
                </div>
            </div>
            <div class="col">
                <h1>All Books</h1>
                {% for book in books %}
                <div class="card mb-3">
                    <div class="card-body">
                        <a href="{%url 'book-show' id=book.id%}">
                            <h5 class="card-title">{{book.title}}</h5>
                        </a>
                        <h6 class="card-subtitle mb-2 text-body-secondary">(added by {{book.upbloaded_by.first_name}})
                        </h6>
                        <p class="card-text">{{book.desc}}</p>
                    </div>
                </div>
                {%endfor%}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
