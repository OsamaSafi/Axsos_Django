<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dojo Survey</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>
    <div class="container">
        <form action="/process" method="post">
            {% csrf_token %}

            <label for="name">Your Name</label>
            <input type="text" name="name" id="name">

            <label for="location">location</label>
            <select name="location" id="location">
                <option value="paris">paris</option>
                <option value="london">london</option>
                <option value="usa">usa</option>
                <option value="uk">uk</option>
            </select>

            <label for="lang">lang</label>
            <select name="lang" id="lang">
                <option value="python">python</option>
                <option value="java">java</option>
                <option value="php">php</option>
                <option value="javascript">javascript</option>
            </select>

            <h3>Gender</h3>
            <label for="gender_m">male</label>
            <input type="radio" name="gender" id="gender_m" value="male">
            <label for="gender_f">female</label>
            <input type="radio" name="gender" id="gender_f" value="female">

            <h3>speaking</h3>
            <label for="arabic">arabic</label>
            <input type="checkbox" name="speak" id="arabic" value="arabic">
            <label for="english">English</label>
            <input type="checkbox" name="speak" id="english" value="english">
            <label for="france">france</label>
            <input type="checkbox" name="speak" id="france" value="france">

            <label for="comment">Comment</label>
            <textarea name="comment" id="comment" cols="30" rows="10"></textarea>

            <input type="submit" value="Submit" class="btn">
        </form>
    </div>

</body>

</html>
