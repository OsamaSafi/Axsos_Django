{%extends 'base.html'%}

{%block content%}
<div style="direction: ltr;" class="wrapper">
    {% if messages %}
    <div style="position: fixed; top: 20px; right: 20px; z-index: 9999; min-width: 300px;">
        {% for message in messages %}
        <div class="toast show animate__animated animate__fadeInRight" role="alert" aria-live="assertive"
            aria-atomic="true" data-delay="4000">
            <div
                class="toast-header {% if message.tags == 'success' %}bg-success{% else %}bg-danger{% endif %} text-white">
                <strong class="mr-auto">
                    {% if message.tags == 'success' %}Success{% else %}Error{% endif %}
                </strong>
                <button type="button" class="ml-2 mb-1 close text-white" data-dismiss="toast" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="toast-body bg-white text-dark shadow-sm">
                {{ message }}
            </div>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    <div class="content-wrapper">
        <!-- Content Header (Page header) -->
        <div class="card card-primary">
            <div class="card-header">
                <h3 class="card-title">Edit Book</h3>
            </div>
            <!-- /.card-header -->
            <!-- form start -->
            <form method="POST" enctype="multipart/form-data">
                {%csrf_token%}
                <div class="card-body">

                    {{form}}

                    <small id='totalrente' class="form-text text-muted"></small>
                </div>
                <!-- /.card-body -->

                <div class="card-footer">
                    <button type="submit" class="btn btn-primary">Update</button>
                </div>
            </form>
        </div>
    </div>
</div>

{%endblock%}
