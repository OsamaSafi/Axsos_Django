<head>

<body dir="ltr" class="hold-transition sidebar-mini">


    {% include 'parts/navbar.html' %}
    {% include 'parts/sidebar.html' %}

    {% block content %}


    {% endblock %}
    {% include 'parts/footer.html' %}

    </div>

    <!-- REQUIRED SCRIPTS -->
    <script src="{% static 'plugins/jquery_datepacker/jquery_ui.js' %}"></script>

    <!-- jQuery -->
    <script src="{% static 'plugins/jquery/jquery.min.js' %}"></script>
    <!-- Bootstrap -->
    <script src="{% static 'plugins/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <!-- AdminLTE -->
    <script src="{% static 'dist/js/adminlte.js' %}"></script>

    <script src="{% static 'dist/js/demo.js' %}"></script>
    <!--<script src="dist/js/pages/dashboard3.js'"></script>
    -->
    <script>
        $(document).ready(function () {
            $('#myModal').on('shown.bs.modal', function () {
                $('#myInput').trigger('focus')
            });

            var total = 0;
            $('.bookprice').each(function () {
                var current_price = $(this).text()
                total += parseInt(current_price)
            })
            $('#totalsalarys').text('$' + total)

            var total_rental = 0
            $('.totalrental').each(function () {
                var current_rental = $(this).text()
                total_rental += parseInt(current_rental)
            })
            $('.rentalsalary').text(total_rental)

            var total_price = 0
            $('.totalprice').each(function () {
                $(this).hide()
                var current_price = $(this).text()
                total_price += parseInt(current_price)
            })
            $('.pricesalary').text(total_price)


            {% for book in books %}
            $(".cat{{book.category.id}}").click(function (e) {
                e.preventDefault(); // يفضل إضافتها لمنع الرابط # من رفع الصفحة لأعلى عند الضغط
                $('.bookhide').hide();
                $(".book{{book.category.id}}").show();
            });

            $(".status{{book.status}}").click(function (e) {
                e.preventDefault(); // يفضل إضافتها لمنع الرابط # من رفع الصفحة لأعلى عند الضغط
                $('.bookhide').hide();
                $(".book{{book.status}}").show();
            });

            {% endfor %}
        });
    </script>





    <script>
        $(function () {
            'use strict'

            var ticksStyle = {
                fontColor: '#495057',
                fontStyle: 'bold'
            }

            var mode = 'index'
            var intersect = true

            var $salesChart = $('#sales-chart')

            var salesChart = new Chart($salesChart, {

                type: 'bar',

                data: {

                    labels: [


                        'Profits details',

                    ],


                    datasets: [
                        {
                            backgroundColor: '#007bff',
                            borderColor: '#007bff',
                            data: [
                                $('.pricesalary').text()
                            ]
                        },
                        {
                            backgroundColor: '#ced4da',
                            borderColor: '#ced4da',
                            data: [
                                $('.rentalsalary').text()
                            ]
                        }
                    ]
                },



                options: {
                    maintainAspectRatio: false,
                    tooltips: {
                        mode: mode,
                        intersect: intersect
                    },
                    hover: {
                        mode: mode,
                        intersect: intersect
                    },
                    legend: {
                        display: false
                    },
                    scales: {
                        yAxes: [{
                            // display: false,
                            gridLines: {
                                display: true,
                                lineWidth: '4px',
                                color: 'rgba(0, 0, 0, .2)',
                                zeroLineColor: 'transparent'
                            },
                            ticks: $.extend({
                                beginAtZero: true,

                                // Include a dollar sign in the ticks
                                callback: function (value, index, values) {
                                    if (value >= 1000) {
                                        value /= 1000
                                        value += 'k'
                                    }
                                    return '$' + value
                                }
                            }, ticksStyle)
                        }],
                        xAxes: [{
                            display: true,
                            gridLines: {
                                display: false
                            },
                            ticks: ticksStyle
                        }]
                    }
                }
            });

            var pieChart = document.getElementById('visitors-chart').getContext('2d')

            var myPieChart = new Chart(pieChart, {
                type: 'pie',
                data: {
                    datasets: [{
                        data: ['{{freebooks}}', '{{soldbooks}}', '{{rentalbooks}}'],
                        backgroundColor: ["#27c100", "#f3545d", "#fdaf4b"],
                        borderWidth: 10,

                    }],
                    labels: ['Available', 'Sold', 'Rented']
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    legend: {
                        position: 'bottom',
                        labels: {
                            fontColor: '#000',
                            fontSize: 15,
                            usePointStyle: true,
                            padding: 30
                        }
                    },
                    pieceLabel: {
                        render: 'percentage',
                        fontColor: 'white',
                        fontSize: 14,
                    },


                }
            })

        })



    </script>

    <script>
        $(document).ready(function () {
            $('.toast').toast({
                autohide: true,  // تفعيل الاختفاء التلقائي
                delay: 4000      // المدة بالملي ثانية (4 ثوانٍ) ثم يختفي
            });
            $('.toast').toast('show'); // تأكيد إظهار التوستر
        });
    </script>

    <script>
        $('#rental_period').keyup(function () {
            $('#total_rental').val($('#rental_period').val() * $('#rental_day').val())
        })
    </script>
