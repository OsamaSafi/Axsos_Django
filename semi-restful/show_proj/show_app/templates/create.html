<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Show</title>
    {%load static%}
    <link rel="stylesheet" href="{%static 'css/style.css'%}">
</head>

<body>
    <div class="container">
        <form action="/show/create" method="post">
            <h1>Add new a Show</h1>
            {% if messages %}
            <div class="error-container"
                style="background-color: #ffe6e6; border: 1px solid red; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
                <ul style="margin: 0; padding-left: 20px;">
                    {% for message in messages %}
                    <li style="color: red; font-weight: bold;">{{ message }}</li>
                    {% endfor %}
                </ul>
            </div>
            {% endif %}
            <a class="btn-c" href="/shows">Go Back</a>
            {%csrf_token%}
            <div class="box">
                <label for="title">title</label>
                <input type="text" name="title" id="title">
            </div>
            <div class="box">
                <div class="network">
                    <div class="form-content">
                        <label for="network">network</label>
                        <input type="text" name="network" id="network">
                    </div>
                    <div class="form-content">
                        <label for="release_date">release_date</label>
                        <input type="date" name="release_date" id="release_date">
                    </div>
                </div>
            </div>
            <div class="box">
                <label for="desc">Description</label>
                <textarea name="desc" id="desc" cols="30" rows="10"></textarea>
            </div>
            <input type="submit" class="btn-c" value="create">
        </form>
    </div>
</body>

</html>
